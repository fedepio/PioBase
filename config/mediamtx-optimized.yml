# MediaMTX Configuration for IP Cam WebRTC Streaming
# Ottimizzato per latenza ultra-bassa (<200ms)
#
# Usare questo file con:
# sudo cp config/mediamtx-optimized.yml /etc/mediamtx/mediamtx.yml
# sudo systemctl restart mediamtx

###############################################
# Global settings

# Logging
logLevel: info
logDestinations: [stdout]

# Performance e Stabilità
readTimeout: 30s
writeTimeout: 30s
readBufferCount: 512
udpMaxPayloadSize: 1472

# Keep-alive per connessioni RTSP stabili
rtspSessionTimeout: 60s
rtspConnectionTimeout: 10s

###############################################
# API HTTP

api: yes
apiAddress: :9997

# Metriche
metrics: yes
metricsAddress: :9998

###############################################
# RTSP Server

rtspAddress: :8554
protocols: [tcp]
rtspEncryption: "no"
rtspTransport: tcp

###############################################
# WebRTC Server - OTTIMIZZATO PER BASSA LATENZA

webrtc: yes
webrtcAddress: :8889
webrtcServerKey: server.key
webrtcServerCert: server.crt
webrtcAllowOrigin: "*"
webrtcTrustedProxies: []
webrtcICEServers2: []

# ICE ottimizzato
webrtcICEHostNAT1To1IPs: []
webrtcICEUDPMuxAddress: ""
webrtcICETCPMuxAddress: ""

###############################################
# HLS Server - LOW LATENCY MODE

hls: yes
hlsAddress: :8890
hlsAllowOrigin: "*"

# HLS Low Latency settings
hlsVariant: lowLatency
hlsSegmentCount: 3           # Solo 3 segmenti in buffer
hlsSegmentDuration: 1s       # 1 secondo per segmento
hlsPartDuration: 200ms       # 200ms per parte (LL-HLS)
hlsSegmentMaxSize: 50M

###############################################
# RTP/RTCP

rtpAddress: :8000
rtcpAddress: :8001

###############################################
# Paths - Configurazione Stream Camera

paths:
  cam:
    # IMPORTANTE: Sostituisci con l'IP della tua camera
    # Esempio: rtsp://username:password@192.168.1.83:554/
    source: rtsp://tony:747@192.168.1.83:554/

    # Protocollo TCP più affidabile per RTSP
    sourceProtocol: tcp

    # IMPORTANTE: false = connessione sempre attiva
    # Riduce drasticamente la latenza di start
    sourceOnDemand: false

    # Timeout e keep-alive per stabilità connessione
    sourceTimeout: 30s
    sourceRetry: yes
    sourceRetryPause: 5s

    # Buffer ottimizzato per bassa latenza
    readBufferCount: 2048

    # RTSP-specific settings per stabilità
    rtspTransport: tcp
    rtspRangeType: npt

    # Hooks (opzionali)
    runOnInit: ""
    runOnDemand: ""
    runOnReady: ""
    runOnRead: ""
    runOnUnread: ""
    runOnNotReady: ""

    # Publisher settings
    disablePublisherOverride: false
    fallback: ""
    overridePublisher: false

###############################################
# Auth (opzionale)

externalAuthenticationURL: ""
authInternalUsers: []

###############################################
# NOTES:
#
# Per WebRTC ultra-bassa latenza:
# - URL WHEP: http://your-server-ip:8889/cam/whep
# - Latenza attesa: ~100-200ms
#
# Per HLS compatibilità:
# - URL HLS: http://your-server-ip:8890/cam/index.m3u8
# - Latenza attesa: ~2-4 secondi (grazie a LL-HLS)
#
# Comandi utili:
# - Restart: sudo systemctl restart mediamtx
# - Status: sudo systemctl status mediamtx
# - Logs: sudo journalctl -u mediamtx -f
# - API: http://your-server-ip:9997/v3/config/global/get
